<!DOCTYPE html>
<html>
	<head>
		<title>browser-amd-editor</title>
		<meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
		
		<link
			rel="stylesheet"
			data-name="vs/editor/editor.main"
			href="./min/vs/editor/editor.main.css"
		/>
		<style>
         .contents {
            position: absolute;
            top: 0px;
            bottom: 0px;
			   left: 0px;
			   right: 0px;
         }
		</style>
	</head>
	<body>

      <div id="content" class="contents"></div>

		<!-- OR ANY OTHER AMD LOADER HERE INSTEAD OF loader.js -->
		<script src="./min/vs/loader.js"></script>
		<script>
			require.config({ paths: { vs: './min/vs' } });

			// post a message to the host (WebView2): the host logs it, so a silent failure is visible
			function postToHost(text) {
				if (window.chrome && window.chrome.webview) {
					window.chrome.webview.postMessage(text);
				}
			}

			require(['vs/editor/editor.main'], function () {
				window.editor = monaco.editor.create(document.getElementById('content'), {
					value: [''].join('\n'),
					language: 'javascript', minimap: { enabled: false },
					automaticLayout: true
				});

				// Ctrl-S (or Cmd-S on macOS) requests a save from the host app.
				// The host (WebView2) listens via WebMessageReceived and runs
				// the save command (see CodeEditorControl / CodeEditorViewModel).
				window.editor.addCommand(
					monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS,
					function () {
						postToHost('save');
					});

				// tell the host the editor is up, and whether the keyboard reaches this page at all
				var keyReported = false;
				document.addEventListener('keydown', function () {
					if (!keyReported) {
						keyReported = true;
						postToHost('key');
					}
				});

				window.editor.focus();
				postToHost('ready');
			}, function (error) {
				postToHost('error: monaco failed to load - ' + error);
			});

			window.addEventListener('error', function (e) {
				postToHost('error: ' + e.message);
			});

			function setEditorText(text, language) {
				monaco.editor.getModels().forEach(model => model.dispose());
				var model = monaco.editor.createModel(text, language);
				window.editor.setModel(model);
         }

			function getEditorText() {
				return window.editor.getValue();
         }
		</script>
	</body>
</html>
